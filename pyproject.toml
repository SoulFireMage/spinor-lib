[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spinor-lib"
version = "0.1.0"
description = "PyTorch spinors with SU(2) rotations, autograd and batching"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["spinor_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
